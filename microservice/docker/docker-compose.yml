x-laravel-app: &laravel-app
    build:
        context: .
        dockerfile: Dockerfile
    image: gateway-laravel-app:latest
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    environment:
        DB_CONNECTION: mysql
        DB_HOST: mysql
        DB_PORT: 3306
        DB_DATABASE: ${DB_DATABASE}
        DB_USERNAME: ${DB_USERNAME}
        DB_PASSWORD: ${DB_PASSWORD}
        SESSION_DRIVER: file
        CACHE_STORE: file
        XDG_CONFIG_HOME: /var/www/html/config
        XDG_DATA_HOME: /var/www/html/data
    networks:
        - gateway
    depends_on:
        mysql:
            condition: service_healthy

x-product-mock: &product-mock
    build:
        context: .
        dockerfile: Dockerfile
    image: gateway-laravel-app:latest
    working_dir: /app
    command: ["sh", "-c", "php -S 0.0.0.0:8080 /app/server.php"]
    volumes:
        - './product-mock:/app:ro'
    environment:
        GATEWAY_SECRET: ${GATEWAY_SECRET:-super-secret-gateway-key}
    networks:
        - gateway

x-order-mock: &order-mock
    build:
        context: .
        dockerfile: Dockerfile
    image: gateway-laravel-app:latest
    working_dir: /app
    command: ["sh", "-c", "php -S 0.0.0.0:8080 /app/server.php"]
    volumes:
        - './order-mock:/app:ro'
    environment:
        INSTANCE_NAME: order-mock-3002
        GATEWAY_SECRET: ${GATEWAY_SECRET:-super-secret-gateway-key}
    networks:
        - gateway

services:
    auth-service:
        <<: *laravel-app
        ports:
            - '3000:80'
        volumes:
            - '../auth-service:/var/www/html'

    product-service:
        <<: *product-mock
        ports:
            - '3001:8080'
        environment:
            INSTANCE_NAME: product-mock-3001
            GATEWAY_SECRET: ${GATEWAY_SECRET:-super-secret-gateway-key}

    product-service-1:
        <<: *product-mock
        ports:
            - '3003:8080'
        environment:
            INSTANCE_NAME: product-mock-3003
            GATEWAY_SECRET: ${GATEWAY_SECRET:-super-secret-gateway-key}

    product-service-2:
        <<: *product-mock
        ports:
            - '3004:8080'
        environment:
            INSTANCE_NAME: product-mock-3004
            GATEWAY_SECRET: ${GATEWAY_SECRET:-super-secret-gateway-key}

    product-service-3:
        <<: *product-mock
        ports:
            - '3005:8080'
        environment:
            INSTANCE_NAME: product-mock-3005
            GATEWAY_SECRET: ${GATEWAY_SECRET:-super-secret-gateway-key}

    order-service:
        <<: *order-mock
        ports:
            - '3002:8080'

    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'gateway-mysql:/var/lib/mysql'
        networks:
            - gateway
        healthcheck:
            test: [ 'CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD}' ]
            retries: 3
            timeout: 5s

    adminer:
        image: adminer:4-standalone
        ports:
            - '${ADMINER_PORT:-8081}:8080'
        environment:
            ADMINER_DEFAULT_SERVER: mysql
        networks:
            - gateway
        depends_on:
            - mysql

networks:
    gateway:
        driver: bridge

volumes:
    gateway-mysql:
        driver: local
